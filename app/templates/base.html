<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="theme-color" content="#4f46e5" />

    <title>
      {% block title %}
        Selora Importer
      {% endblock %}
    </title>

    <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}" type="image/x-icon" />

    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />

    {% block head %}

    {% endblock %}
  </head>

  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="app-header__inner">
          <a href="{{ url_for('web.index') }}" class="brand" aria-label="Selora Importer">
            <span class="brand__mark">S</span>

            <span class="brand__content">
              <span class="brand__title">Selora Importer</span>

              <span class="brand__subtitle">Instagram Shop Migration</span>
            </span>
          </a>

          <nav class="app-nav" aria-label="منوی اصلی">
            <a href="{{ url_for('web.index') }}" class="app-nav__link {% if request.endpoint == 'web.index' %}is-active{% endif %}">شروع کراول</a>

            <a href="{{ url_for('web.crawl_list') }}" class="app-nav__link {% if request.endpoint in ['web.crawl_list', 'web.crawl_detail'] %}is-active{% endif %}">نشست‌ها</a>

            <form action="{{ url_for('runtime_safe_exit') }}" method="post" onsubmit="return confirm('از Selora Importer به‌صورت امن خارج می‌شوید. ادامه می‌دهید؟');">
              <input type="hidden" name="token" value="{{ safe_exit_token }}" />
              <button type="submit" class="button button--secondary button--small">خروج امن</button>
            </form>
          </nav>
        </div>
      </header>

      <main class="app-main">
        <div class="container">
          {% block breadcrumb %}

          {% endblock %}

          {% block content %}

          {% endblock %}
        </div>
      </main>
    </div>

    {% block scripts %}

    {% endblock %}
  </body>
</html>
