<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="theme-color" content="#4f46e5" />

    <title>
      {% block title %}
        Selora Importer
      {% endblock %}
    </title>

    <!-- Favicon -->
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}" type="image/x-icon" />

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />

    {% block head %}

    {% endblock %}
  </head>

  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="app-header__inner">
          <a href="{{ url_for('web.index') }}" class="brand" aria-label="Selora Importer">
            <span class="brand__mark">S</span>

            <span class="brand__content">
              <span class="brand__title">Selora Importer</span>

              <span class="brand__subtitle">Instagram Shop Migration</span>
            </span>
          </a>
        </div>
      </header>

      <main class="app-main">
        <div class="container">
          {% block content %}

          {% endblock %}
        </div>
      </main>
    </div>

    {% block scripts %}

    {% endblock %}
  </body>
</html>
